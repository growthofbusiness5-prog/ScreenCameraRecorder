name: Build Screen Camera Recorder APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          pwd
          ls -la
          find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          if [ -f ScreenCameraRecorder/settings.gradle.kts ] || [ -f ScreenCameraRecorder/settings.gradle ]; then
            cd ScreenCameraRecorder
          fi
          gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCameraRecorder-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            ScreenCameraRecorder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
